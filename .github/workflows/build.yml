# psp5 – made by Mille Weber
# Bygger båda versionerna (ARK-5, ARK-4) och packar de två release-zipparna (de gäller alla enheter: PSP, PSP Go, PS Vita).
name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Not ubuntu-latest: that became Ubuntu 26.04 in November 2026, which has no libgpgme.so.11, and the pspdev toolchain's psp-pacman (built on Ubuntu 24.04) needs it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo bash tools/setup-wsl.sh
      - name: Build
        run: |
          bash tools/build.sh
          bash tools/build.sh ark4
      - name: Zips
        run: python3 tools/make_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/*.zip
